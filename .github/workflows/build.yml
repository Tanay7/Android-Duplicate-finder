name: Build APK
on:
  push:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: # a newer push supersedes a running build of the same branch
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests, lint, the minified release APK and a test build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDebug
      - name: Test report (failures in full)
        if: failure()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -B2 -A25 "<failure" "$f" || true; done
      - name: Lint findings (errors in full, warning count)
        if: always()
        run: |
          f=app/build/reports/lint.txt
          [ -f $f ] || exit 0
          grep -E ": Error: " $f || echo "no lint errors"
          echo "warnings: $(grep -cE ': Warning: ' $f)"; grep -E ': Warning: ' $f | sed -E 's/.*\[(\w+)\]$/\1/' | sort | uniq -c | sort -rn
      - name: APK size
        run: |
          ls -l app/build/outputs/apk/release/
          # the test build goes along for the device tests only (it is never published)
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk out/
      - uses: actions/upload-artifact@v4
        continue-on-error: true # a full artifact store must not stop the build; the device tests fall back to release/
        with:
          name: PhotoCleaner-apk
          path: out/*.apk
          retention-days: 3
      - name: Publish APK to release/ in the repo
        run: bash scripts/publish.sh "Update release/PhotoCleaner.apk [skip ci]" app/build/outputs/apk/release/app-release.apk release/PhotoCleaner.apk
  device-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [36, 37] # Android 16 and Android 17
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PhotoCleaner-apk
          path: apk
      - name: Without the artifact, the APK this build published to release/
        run: |
          [ -f apk/app-release.apk ] && exit 0
          git fetch -q origin "$GITHUB_REF_NAME"
          git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':(exclude)release' ':(exclude)docs' ':(exclude)*.md' || { echo "Newer code is on the branch; its build tests it"; exit 1; }
          mkdir -p apk && git show FETCH_HEAD:release/PhotoCleaner.apk > apk/app-release.apk && ls -l apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test photos (copies, look-alikes, a burst, document pages, screens, broken files)
        run: |
          python -m pip install --quiet pillow
          python scripts/make_test_photos.py testdata
          find testdata -type f | sort
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Resolve the emulator image (package names vary, e.g. android-37 vs android-37.0)
        id: img
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          "$SDKM" --list > sdk.txt 2>/dev/null || true
          IMGS=$(grep -oE "system-images;android-${{ matrix.api }}(\.[0-9]+)?;google_apis;x86_64" sdk.txt | sed -E 's/system-images;android-([^;]+);.*/\1/' | sort -uV)
          echo "available google_apis x86_64 images: $(echo $IMGS)"
          if echo "$IMGS" | grep -qx "${{ matrix.api }}"; then API=${{ matrix.api }}; else API=$(echo "$IMGS" | tail -1); fi
          echo "resolved api-level: ${API:-none}"
          echo "api=${API:-${{ matrix.api }}}" >> "$GITHUB_OUTPUT"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.img.outputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          disk-size: 6144M
          emulator-boot-timeout: 1500
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-test.sh apk/app-release.apk testdata apk/app-debug.apk
      - name: Publish screenshots to docs/screenshots (Android 16 run)
        if: always() && matrix.api == 36
        run: |
          ls screen-*.png >/dev/null 2>&1 || exit 0
          args=(); for f in screen-*.png; do args+=("$f" "docs/screenshots/${f#screen-}"); done
          bash scripts/publish.sh "Update device screenshots [skip ci]" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: device-logs-api${{ matrix.api }}
          retention-days: 3
          path: |
            logcat.txt
            monkey-*.txt
            screen-*.png
